<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1056" viewBox="0 0 1280 1056" role="img" aria-labelledby="title desc">
  <title id="title">Buku product architecture</title>
  <desc id="desc">Client information: rekening koran, existing ledgers, financial statements, company profiles, and supporting documents. A shared business foundation holds document evidence, the double-entry general ledger, and company context. Buku intelligence understands documents, suggests accounting treatments, queries financial data, and explains with sources. People use Ask Buku, Accounting Workspace, and Reporting and Close. Accounting controls, human review, and source traceability span all layers. This is a product capability map, not an automatic posting flow.</desc>
  <defs>
    <style>
      text { font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #0A2540; }
      .title { font-size: 34px; font-weight: 650; letter-spacing: -1px; }
      .heading { font-size: 23px; font-weight: 650; letter-spacing: -.4px; }
      .body { font-size: 18px; }
      .small { font-size: 16px; }
      .muted { fill: #52677C; }
      .blue { fill: #0A5CFF; }
      .white { fill: white; }
      .label { font-size: 17px; font-weight: 600; }
      .line { stroke: #A7BBD5; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="4" refY="3.5" orient="auto"><path d="M0 0 5 3.5 0 7" fill="none" stroke="#A7BBD5" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1280" height="1056" rx="16" fill="#F6F9FC"/>
  <rect x="40" y="38" width="40" height="40" rx="9" fill="#0A5CFF"/>
  <text x="60" y="66" text-anchor="middle" class="heading white">B</text>
  <text x="93" y="65" class="heading">Buku</text>
  <text x="1240" y="63" text-anchor="end" class="small muted">Product architecture</text>
  <text x="40" y="127" class="title">Understand the business. Maintain the books. Prepare the close.</text>

  <!-- User-facing experiences share the same intelligence and business foundation. -->
  <text x="40" y="176" class="label muted">One workspace, three ways to work</text>
  <g>
    <rect x="40" y="195" width="384" height="126" rx="10" fill="white" stroke="#D8E2ED"/>
    <text x="64" y="235" class="heading">Ask Buku</text>
    <text x="64" y="267" class="body muted">Questions and financial insights</text>
    <text x="64" y="294" class="small muted">Across clients, groups, and companies</text>
    <rect x="448" y="195" width="384" height="126" rx="10" fill="white" stroke="#D8E2ED"/>
    <text x="472" y="235" class="heading">Accounting Workspace</text>
    <text x="472" y="267" class="body muted">Prepare, review, and reconcile</text>
    <text x="472" y="294" class="small muted">Clear work queues and source evidence</text>
    <rect x="856" y="195" width="384" height="126" rx="10" fill="white" stroke="#D8E2ED"/>
    <text x="880" y="235" class="heading">Reporting &amp; Close</text>
    <text x="880" y="267" class="body muted">Financial reports and close readiness</text>
    <text x="880" y="294" class="small muted">Know what is complete and what is missing</text>
  </g>
  <path d="M640 365V344H232V326M640 344V326M640 344H1048V326" class="line"/>

  <!-- AI is a capability layer, not the journal writer or source of financial amounts. -->
  <rect x="40" y="365" width="1200" height="160" rx="12" fill="#0A2540"/>
  <text x="64" y="409" class="heading white">Buku intelligence</text>
  <text x="64" y="440" class="body" style="fill:#CBDCF0">AI grounded in your books, source documents, and business context</text>
  <g class="small white">
    <text x="64" y="488" class="white">Understand documents</text>
    <text x="352" y="488" class="white">Suggest accounting treatments</text>
    <text x="720" y="488" class="white">Query financial data</text>
    <text x="1000" y="488" class="white">Explain with sources</text>
  </g>
  <path d="M232 593V554H640V531M640 593V554M1048 593V554H640" class="line"/>

  <!-- Ledger is visibly the central accounting core; evidence is not posted books. -->
  <rect x="40" y="580" width="1200" height="196" rx="12" fill="#EDF3FA" stroke="#D8E2ED"/>
  <text x="64" y="610" class="label muted">Shared business foundation</text>
  <rect x="56" y="630" width="352" height="128" rx="8" fill="white" stroke="#D8E2ED"/>
  <text x="80" y="670" class="heading">Document Evidence</text>
  <text x="80" y="701" class="body muted">What the source says</text>
  <text x="80" y="733" class="small muted">Documents, reported figures, citations</text>
  <rect x="424" y="630" width="432" height="128" rx="8" fill="#0A5CFF"/>
  <text x="448" y="670" class="heading white">General Ledger</text>
  <text x="448" y="701" class="body white">Buku’s double-entry accounting core</text>
  <text x="448" y="733" class="small white">Posted journals power financial reports</text>
  <rect x="872" y="630" width="352" height="128" rx="8" fill="white" stroke="#D8E2ED"/>
  <text x="896" y="670" class="heading">Company Context</text>
  <text x="896" y="701" class="body muted">How the business works</text>
  <text x="896" y="733" class="small muted">Activities, entities, confirmed context</text>
  <path d="M640 829V783" class="line" marker-end="url(#arrow)"/>

  <text x="40" y="819" class="label muted">Bring the information you already have</text>
  <rect x="40" y="841" width="1200" height="105" rx="10" fill="white" stroke="#D8E2ED"/>
  <path d="M280 859V929M520 859V929M760 859V929M1000 859V929" stroke="#E3E8EE"/>
  <g text-anchor="middle">
    <text x="160" y="880" class="label">Rekening koran</text><text x="160" y="910" class="small muted">Bank transactions</text>
    <text x="400" y="880" class="label">Existing ledgers</text><text x="400" y="910" class="small muted">GL and trial balances</text>
    <text x="640" y="880" class="label">Financial statements</text><text x="640" y="910" class="small muted">Reported financial results</text>
    <text x="880" y="880" class="label">Company profiles</text><text x="880" y="910" class="small muted">Business background</text>
    <text x="1120" y="880" class="label">Supporting documents</text><text x="1120" y="910" class="small muted">Contracts and workpapers</text>
  </g>
  <rect x="40" y="970" width="1200" height="52" rx="8" fill="#E7EFF9"/>
  <text x="640" y="1003" text-anchor="middle" class="label">Accounting controls · Human review · Source traceability</text>
</svg>
