function syncURL(){const p=new URLSearchParams({scope:state.scope,period:state.period,view:state.view});history.replaceState(null,'',`${location.pathname}?${p}`);}
function selected(scope=state.scope){return companies.filter(c=>scope==='all'||c.id===scope||c.group===scope);}
function scopeName(scope=state.scope){return scopes.find(x=>x[0]===scope)?.[1]||'Semua klien';}
// Reports are calculated from the synthetic double-entry journals, just as in Buku.
function figures(c,period=state.period,reviewed=state.reviewed){
  if(period==='2026-09')return null;
  const balances={};
  for(const entry of journalEntries(c,period,reviewed))for(const [code,,debit,credit] of entry.lines)balances[code]=(balances[code]||0n)+debit-credit;
  const revenue=-(balances['4100']||0n),cost=balances['5100']||0n,expense=(balances['6100']||0n)+(balances['6200']||0n);
  return {revenue,cost,expense,profit:revenue-cost-expense,cash:balances['1100']||0n,suspense:balances['1999']||0n,opening:c.opening};
}
// Source figures belong to immutable invented documents; they never depend on review state.
function sourceFigures(c,period){
  const [revenue,cost,baseExpense]=period==='2026-07'?c.july:[c.revenue,c.cost,c.expense];
  const expense=baseExpense+(c.id==='nusa'&&period==='2026-08'?2400000n:0n);
  return {revenue,cost,expense,profit:revenue-cost-expense,cash:c.opening+revenue-cost-expense};
}
function isClosed(c,period=state.period){return period==='2026-07'||(period==='2026-08'&&(c.id!=='nusa'||state.closed));}
function hasPending(){return state.period==='2026-08'&&!state.reviewed&&selected().some(c=>c.id==='nusa');}
function badge(text,type='source'){return `<span class="badge ${type}">${type==='pass'?'✓ ':type==='review'?'! ':''}${esc(text)}</span>`;}
function notify(text){clearTimeout(toastTimer);document.getElementById('toast').textContent=text;toastTimer=setTimeout(()=>document.getElementById('toast').textContent='',4200);}
function navigate(view,scope){if(scope)state.scope=scope;state.view=view;state.filter='Semua';state.search='';syncURL();render();document.getElementById('page-title')?.focus();window.scrollTo({top:0,behavior:'instant'});}
function brand(){return '<div class="brand"><span class="brand-mark">B</span>Buku</div>';}
function renderLogin(){root.innerHTML=`<main class="login" id="main"><section class="login-story">${brand()}<h1>Kenali bisnisnya.<br>Rapikan bukunya.</h1><p>Dokumen, buku besar, dan konteks perusahaan. Satu ruang kerja untuk menyelesaikan pekerjaan akuntansi.</p><div class="login-foundation"><strong>Semua bukti saling terhubung</strong><div class="core"><strong>Buku Besar</strong><small>Jurnal berpasangan. Laporan yang bisa ditelusuri.</small></div><p>Rekening koran, laporan keuangan, dan profil perusahaan tetap dekat dengan pekerjaan Anda.</p></div></section><section class="login-form-wrap"><div class="login-form"><div class="mobile-brand">${brand()}</div><h2>${state.loginStep==='email'?'Masuk ke ruang kerja':'Periksa kode masuk'}</h2><p>${state.loginStep==='email'?'Akses hanya untuk pengguna yang sudah diundang.':'Simulasi kode untuk '+esc(state.email)+'.'}</p><form id="login-form" class="login-stage">${state.loginStep==='email'?`<div class="field"><label for="email">Email kerja</label><input id="email" name="email" type="email" value="akuntan@buku.example" autocomplete="email" required></div>`:`<div class="field"><label for="code">Kode 6 digit</label><input id="code" name="code" class="code-input" type="text" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required aria-describedby="code-hint"><small id="code-hint">Kode contoh: <strong>123456</strong>. Tidak ada email yang dikirim.</small></div>`}<p class="error" role="alert">${esc(state.loginError)}</p><button class="btn primary" type="submit">${state.loginStep==='email'?'Kirim kode masuk':'Masuk ke Buku'}</button></form>${state.loginStep==='code'?'<button class="link small" style="margin-top:15px" data-action="login-back">Gunakan email lain</button>':''}<div class="notice"><strong>Simulasi untuk review desain</strong><br>Email tidak dikirim. Gunakan <strong>akuntan@buku.example</strong>. Undangan dikelola operator; tidak ada pendaftaran mandiri.</div></div></section></main>`;}
function sidebar(){return `<aside class="sidebar"><div>${brand()}<div class="firm">Kantor Demo &amp; Rekan<br>Ruang kerja bersama</div></div><nav class="nav" aria-label="Navigasi utama">${[['home','Beranda','home'],['work','Pekerjaan','work'],['documents','Dokumen','doc'],['reports','Laporan','report']].map(([v,label,i])=>`<button class="nav-btn ${state.view===v||v==='reports'&&['ledger','close'].includes(state.view)?'active':''}" data-action="nav" data-view="${v}" ${state.view===v?'aria-current="page"':''}>${icon(i)}<span>${label}</span>${v==='work'&&hasPending()?'<span class="nav-count">1</span>':''}</button>`).join('')}</nav><div class="sidebar-note">Setiap angka punya sumber.<br>Setiap keputusan bisa ditelusuri.</div><div class="sidebar-bottom"><div class="row"><div class="avatar">AK</div><div class="identity">Akuntan demo<br><small>Semua klien</small></div><button class="btn ghost icon-only" data-action="logout" aria-label="Keluar">${icon('logout')}</button></div></div></aside>`;}
function topbar(){return `<header class="topbar"><div class="scope-field"><label class="scope-label" for="scope">Cakupan kerja</label><select id="scope" class="select"><option value="all" ${state.scope==='all'?'selected':''}>Semua klien</option><optgroup label="Grup Nusa">${scopes.slice(1,4).map(([v,t])=>`<option value="${v}" ${v===state.scope?'selected':''}>${esc(t)}</option>`).join('')}</optgroup><optgroup label="Klien Aruna">${scopes.slice(4).map(([v,t])=>`<option value="${v}" ${v===state.scope?'selected':''}>${esc(t)}</option>`).join('')}</optgroup></select></div><div class="scope-field period-field"><label class="scope-label" for="period">Periode</label><select id="period" class="select">${Object.entries(PERIODS).map(([v,t])=>`<option value="${v}" ${v===state.period?'selected':''}>${t}</option>`).join('')}</select></div><div class="topbar-side">${selected().length} perusahaan <span aria-hidden="true">·</span> IDR</div><button class="btn ghost icon-only" data-action="history" aria-label="Riwayat pertanyaan">${icon('clock')}</button></header>`;}
function heading(title,description,action=''){return `<div class="page-head"><div><h1 id="page-title" tabindex="-1">${title}</h1><p>${description}</p></div>${action}</div>`;}
function askCard(){return `<section class="ask-card" aria-labelledby="ask-title"><div class="ask-title">${icon('ask')}<h2 id="ask-title">Tanya Buku</h2><span class="ask-scope">${esc(scopeName())} · ${PERIODS[state.period]}</span></div><form class="ask-form" id="ask-form"><label for="question" class="sr-only">Pertanyaan tentang cakupan terpilih</label><input id="question" class="ask-input" placeholder="Apa yang menghambat tutup buku bulan ini?" maxlength="500" required><button class="btn primary" type="submit" ${state.askBusy?'disabled':''}>${state.askBusy?'Menyiapkan…':'Tanyakan'} ${icon('up')}</button></form><div class="suggestions">${['Klien mana yang belum siap tutup buku?','Bandingkan laba laporan dengan buku','Apa kegiatan usaha perusahaan?'].map(q=>`<button class="suggestion" data-action="ask" data-question="${q}">${q}</button>`).join('')}</div></section>`;}
function taskPanel(){if(state.period==='2026-09')return `<section class="panel"><div class="panel-head"><h2>Perlu ditangani</h2></div><div class="empty"><h3>Belum ada dokumen September</h3><p>Pilih Agustus 2026 untuk mencoba alur review lengkap. Tidak adanya transaksi belum berarti buku siap ditutup.</p></div></section>`;const pending=hasPending();const ready=selected().some(c=>!isClosed(c));return `<section class="panel"><div class="panel-head"><div><h2>Perlu ditangani</h2><p>${pending?'Selesaikan klasifikasi sebelum tutup buku.':ready?'Pemeriksaan selesai. Konfirmasi penutupan buku.':'Semua pekerjaan pada cakupan ini selesai.'}</p></div>${badge(pending?'1 pekerjaan':ready?'Siap ditutup':'Selesai',pending||ready?'review':'pass')}</div>${pending?`<div class="task"><div class="task-symbol">${icon('work')}</div><div class="task-body"><div class="row between wrap-mobile"><h3>Konfirmasi biaya operasional</h3><span class="num">${money(2400000n)}</span></div><div class="task-meta">PT Nusa Niaga · BCA · 28 Agu</div><p>Pembelian perlengkapan kantor masih tercatat di akun penampung. Usulan akun sudah tersedia.</p><button class="btn" data-action="review">Periksa transaksi ${icon('arrow')}</button></div></div>`:ready?`<div class="task"><div class="task-symbol">${icon('check')}</div><div class="task-body"><h3>PT Nusa Niaga siap ditutup</h3><p>Klasifikasi selesai, selisih sumber terselesaikan, dan saldo bank cocok.</p><button class="btn" data-action="close-view" data-company="nusa">Periksa tutup buku ${icon('arrow')}</button></div></div>`:`<div class="empty"><h3>Buku sudah ditutup</h3><p>Lihat laporan atau telusuri bukti di balik setiap angka.</p></div>`}<div class="activity">${icon('check')}<div>${pending?'Buku menyiapkan usulan akun.':'Pemeriksaan untuk periode ini selesai.'}<br><span class="small">Perhitungan dari jurnal. Keputusan review tetap pada Anda.</span></div></div></section>`;}
function closePanel(){const cs=selected(),count=cs.filter(c=>isClosed(c)).length;return `<section class="panel"><div class="panel-head"><h2>Progres tutup buku</h2><span class="small muted">${PERIODS[state.period].split(' ')[0]}</span></div><div class="close-summary"><div class="close-number">${count} <span>dari ${cs.length} perusahaan selesai</span></div><div class="progress" role="progressbar" aria-label="Perusahaan selesai tutup buku" aria-valuemin="0" aria-valuemax="${cs.length}" aria-valuenow="${count}"><span style="width:${count/cs.length*100}%"></span></div></div><div class="close-items">${cs.map(c=>`<div class="close-item"><div><button class="link" data-action="close-view" data-company="${c.id}">${c.short}</button><small>${c.group==='nusa-group'?'Grup Nusa':'Klien Aruna'}</small></div>${badge(isClosed(c)?'Ditutup':state.period==='2026-09'?'Belum ada data':state.reviewed?'Siap ditutup':'Perlu review',isClosed(c)?'pass':'review')}</div>`).join('')}</div></section>`;}
function financeTable(){return `<section class="panel finance-panel"><div class="panel-head"><div><h2>Ringkasan keuangan</h2><p>Angka dari Buku Besar · ${PERIODS[state.period]}</p></div><button class="link small" data-action="nav" data-view="reports">Lihat laporan</button></div><div class="table-wrap"><table><thead><tr><th>Perusahaan</th><th class="right hide-mobile">Pendapatan</th><th class="right">Laba bersih</th><th class="right hide-medium">Kas &amp; bank</th></tr></thead><tbody>${selected().map(c=>{const f=figures(c);return `<tr><td><button class="link table-label" data-action="report-company" data-company="${c.id}">${c.short}</button><small>${c.group==='nusa-group'?'Grup Nusa':'Klien Aruna'}</small></td><td class="right num hide-mobile">${f?money(f.revenue):'Belum ada data'}</td><td class="right"><button class="link num" data-action="report-company" data-company="${c.id}">${f?money(f.profit):'Belum ada data'}</button></td><td class="right num hide-medium">${f?money(f.cash):'Belum ada data'}</td></tr>`;}).join('')}</tbody></table></div><div class="panel-foot">${state.scope==='all'?'Perbandingan antarperusahaan, bukan laporan konsolidasi.':selected().length>1?'Setiap perusahaan ditampilkan terpisah; tidak ada eliminasi konsolidasi.':'Angka dapat ditelusuri ke jurnal dan sumber aslinya.'}${hasPending()?' Laba masih sementara: satu transaksi perlu review.':''}</div></section>`;}
function home(){return heading('Pekerjaan jelas. Buku terjaga.',`${PERIODS[state.period]} · ${esc(scopeName())}`,badge('Ruang kerja bersama'))+askCard()+`<div class="main-grid">${taskPanel()}${closePanel()}</div>`+financeTable();}
function work(){return heading('Pekerjaan','Tuntaskan pengecualian, lalu konfirmasi tutup buku.')+`<div class="main-grid">${taskPanel()}${closePanel()}</div>`+`<div class="notice" style="margin-top:20px">Cakupan dan periode berlaku untuk seluruh daftar. Akun penampung harus diselesaikan sebelum buku dapat ditutup.</div>`;}
function docsFor(c,period){return[{id:`${c.id}:${period}:bank`,company:c.id,period,type:'Rekening koran',name:`BCA — ${c.short} — ${PERIODS[period]}.pdf`,where:'Halaman 1 · baris 4',basis:'Bukti transaksi'},{id:`${c.id}:${period}:ledger`,company:c.id,period,type:'Buku besar',name:`Buku besar — ${c.short}.xlsx`,where:'Saldo Awal!A2:D3',basis:'Sudah dicatat ke buku'},{id:`${c.id}:${period}:report`,company:c.id,period,type:'Laporan keuangan',name:`Laba rugi — ${c.short} — ${PERIODS[period]}.xlsx`,where:'Laba Rugi!B8',basis:'Angka dari dokumen'},{id:`${c.id}:${period}:profile`,company:c.id,period,type:'Profil perusahaan',name:`Profil — ${c.short}.pdf`,where:'Halaman 1 · kegiatan usaha',basis:'Konteks terkonfirmasi'},{id:`${c.id}:${period}:support`,company:c.id,period,type:'Dokumen pendukung',name:`Perjanjian sewa — ${c.short}.pdf`,where:'Halaman 2 · pasal 3',basis:'Bukti pendukung'}];}
function documents(){const all=state.period==='2026-09'?[]:selected().flatMap(c=>docsFor(c,state.period));const docs=all.filter(d=>(state.filter==='Semua'||d.type===state.filter)&&`${d.name} ${d.type}`.toLowerCase().includes(state.search.toLowerCase()));return heading('Dokumen','Rekening koran, buku lama, laporan, dan konteks bisnis dalam satu tempat.')+`<div class="toolbar"><label class="sr-only" for="doc-search">Cari dokumen</label><input id="doc-search" class="search" placeholder="Cari nama dokumen…" value="${esc(state.search)}"><label class="sr-only" for="doc-filter">Jenis dokumen</label><select id="doc-filter" class="search">${['Semua','Rekening koran','Buku besar','Laporan keuangan','Profil perusahaan','Dokumen pendukung'].map(t=>`<option ${state.filter===t?'selected':''}>${t}</option>`).join('')}</select><span class="small muted">${docs.length} dokumen</span></div><section class="panel">${docs.length?docs.map(d=>`<div class="doc-row"><div class="doc-icon">${icon(d.type==='Buku besar'?'book':'doc')}</div><div class="doc-info"><button class="link" data-action="source" data-doc="${d.id}">${d.name}</button><small>${d.type} · ${d.where}</small></div>${badge(d.basis)}<button class="btn ghost icon-only" aria-label="Buka ${esc(d.name)}" data-action="source" data-doc="${d.id}">${icon('arrow')}</button></div>`).join(''):`<div class="empty"><h3>${all.length?'Dokumen tidak ditemukan':'Belum ada dokumen pada periode ini'}</h3><p>${all.length?'Ubah kata pencarian atau jenis dokumen.':'Pilih Agustus atau Juli untuk menelusuri contoh dokumen.'}</p></div>`}</section><div class="notice" style="margin-top:17px">Laporan unggahan adalah angka yang dilaporkan sumber. Buku Besar hanya berubah melalui pencatatan yang tervalidasi. Profil perusahaan memberi konteks, bukan saldo.</div>`;}
function reports(){const cs=selected();if(cs.length!==1)return heading('Laporan','Pilih perusahaan untuk membuka laporan dan menelusuri angka.',`<button class="btn" data-action="nav" data-view="close">Progres tutup buku</button>`)+financeTable();const c=cs[0],f=figures(c);return heading('Laporan keuangan',`${c.name} · ${PERIODS[state.period]}`,f?badge(isClosed(c)?'Buku ditutup':'Buku terbuka',isClosed(c)?'pass':'review'):'')+`<div class="toolbar"><button class="tab-btn active" aria-current="page">Laba rugi</button><button class="tab-btn" data-action="nav" data-view="ledger">Buku Besar</button><button class="tab-btn" data-action="nav" data-view="close">Tutup buku</button></div>`+(f?`<div class="stats-strip"><div class="stat"><p>Kas &amp; bank</p><strong class="num">${money(f.cash)}</strong></div><div class="stat"><p>Laba bersih</p><strong class="num">${money(f.profit)}</strong></div><div class="stat"><p>Akun penampung</p><strong class="num">${money(f.suspense)}</strong></div></div><section class="panel"><div class="panel-head"><div><h2>Laba rugi</h2><p>Dihitung dari jurnal yang dicatat di Buku.</p></div>${badge('Dari Buku Besar','ai')}</div><table><thead><tr><th>Akun</th><th class="right">${PERIODS[state.period]}</th></tr></thead><tbody>${[['Pendapatan',f.revenue],['Harga pokok penjualan',-f.cost],['Laba kotor',f.revenue-f.cost],['Beban usaha',-f.expense],['Laba bersih',f.profit]].map(([label,value],i)=>`<tr class="${i===4?'report-total':''}"><td>${label}</td><td class="right"><button class="link num" data-action="nav" data-view="ledger" aria-label="Telusuri ${label} ke Buku Besar">${money(value)}</button></td></tr>`).join('')}</tbody></table><div class="panel-foot">Klik angka untuk menelusuri jurnal dan dokumen sumber.${f.suspense?' Laba sementara sampai akun penampung diselesaikan.':''}</div></section><div class="row between wrap-mobile" style="margin-top:18px"><button class="btn" data-action="source" data-doc="${c.id}:${state.period}:report">${icon('doc')} Bandingkan laporan unggahan</button><button class="btn" data-action="nav" data-view="close">Periksa tutup buku ${icon('arrow')}</button></div>`:`<div class="panel empty"><h3>Belum ada jurnal September</h3><p>Laporan belum tersedia. Pilih Juli atau Agustus; tidak ada saldo nol yang diasumsikan.</p></div>`);}
function journalEntries(c,period=state.period,reviewed=state.reviewed){if(period==='2026-09')return[];const [revenue,cost,base]=period==='2026-07'?c.july:[c.revenue,c.cost,c.expense];const list=[{id:'OPEN-01',date:'01',memo:'Saldo awal dari buku lama',source:'ledger',lines:[['1100','Kas & bank',c.opening,0n],['3100','Modal',0n,c.opening]]},{id:'BANK-01',date:'05',memo:'Penerimaan pelanggan',source:'bank',lines:[['1100','Kas & bank',revenue,0n],['4100','Pendapatan',0n,revenue]]},{id:'BANK-02',date:'12',memo:'Pembelian barang dagang / biaya jasa',source:'bank',lines:[['5100','Harga pokok',cost,0n],['1100','Kas & bank',0n,cost]]},{id:'BANK-03',date:'20',memo:'Biaya sewa dan operasional',source:'support',lines:[['6100','Beban operasional',base,0n],['1100','Kas & bank',0n,base]]}];if(c.id==='nusa'&&period==='2026-08'){list.push({id:'BANK-04',date:'28',memo:'Perlengkapan kantor — menunggu klasifikasi',source:'bank',lines:[['1999','Akun penampung',2400000n,0n],['1100','Kas & bank',0n,2400000n]]});if(reviewed)list.push({id:'RECLASS-01',date:'28',memo:'Hasil review perlengkapan kantor',source:'bank',lines:[[state.account,state.account==='6100'?'Beban operasional':'Beban pemasaran',2400000n,0n],['1999','Akun penampung',0n,2400000n]]});}return list;}
function ledger(){const cs=selected();if(cs.length!==1)return heading('Buku Besar','Buku berpasangan untuk setiap perusahaan.')+`<section class="panel">${cs.map(c=>`<div class="doc-row"><div class="doc-icon">${icon('book')}</div><button class="link" data-action="ledger-company" data-company="${c.id}">${c.name}</button><span class="spacer"></span>${icon('arrow')}</div>`).join('')}</section>`;const c=cs[0],entries=journalEntries(c),f=figures(c);return `<div class="breadcrumb"><button class="link" data-action="nav" data-view="reports">Laporan keuangan</button>${icon('arrow')}<span>Buku Besar</span></div>`+heading('Buku Besar',`${c.name} · ${PERIODS[state.period]}`)+`<section class="panel"><div class="panel-head"><div><h2>Jurnal yang telah dicatat</h2><p>${entries.length} jurnal · setiap jurnal seimbang</p></div>${entries.length?badge('Debit = kredit','pass'):''}</div>${entries.length?`<div class="table-wrap"><table><thead><tr><th>Jurnal / akun</th><th class="right">Debit</th><th class="right">Kredit</th></tr></thead><tbody>${entries.map(j=>`<tr><td colspan="3" style="background:#f6f9fc"><button class="link table-label" data-action="source" data-doc="${c.id}:${state.period}:${j.source}">${j.id} · ${j.memo}</button><small>${j.date} ${PERIODS[state.period]} · Lihat sumber</small></td></tr>${j.lines.map(([code,name,debit,credit])=>`<tr><td>${code} ${name}</td><td class="num right">${money(debit)}</td><td class="num right">${money(credit)}</td></tr>`).join('')}`).join('')}</tbody></table></div>`:`<div class="empty"><h3>Belum ada jurnal</h3><p>Pilih periode yang sudah memiliki bukti pencatatan.</p></div>`}<div class="panel-foot">Jurnal asli tetap tersimpan. Review membuat jurnal reklasifikasi.${f?.suspense?' Saldo 1999 masih perlu diselesaikan.':''}</div></section><div class="row wrap-mobile" style="margin-top:18px"><button class="btn" data-action="nav" data-view="reports">Kembali ke laporan</button><button class="btn" data-action="nav" data-view="close">Periksa tutup buku</button></div>`;}
function closeView(){const cs=selected();if(cs.length!==1)return heading('Tutup buku','Pilih perusahaan untuk memeriksa kontrol dan menyelesaikan penutupan.')+closePanel();const c=cs[0],f=figures(c),closed=isClosed(c),blocked=!f||f.suspense>0n;return heading('Tutup buku',`${c.name} · ${PERIODS[state.period]}`,badge(closed?'Buku ditutup':blocked?'Belum siap':'Siap ditutup',closed?'pass':'review'))+`<section class="panel"><div class="panel-head"><div><h2>${closed?'Penutupan selesai':blocked?'Selesaikan pemeriksaan berikut':'Semua kontrol lolos'}</h2><p>${closed?'Laporan dan sumber tetap bisa ditelusuri.':blocked?'Buku belum dapat ditutup.':'Konfirmasi review sebelum mengunci periode.'}</p></div></div>${!f?`<div class="control warn">${icon('warn')}<div><h3>Dokumen dan jurnal belum tersedia</h3><p>Tidak ada data bukan berarti tidak ada transaksi.</p></div></div>`:[['Jurnal seimbang','Total debit sama dengan total kredit.',false],['Saldo bank cocok',`Saldo rekening koran dan Buku Besar: ${money(f.cash)}.`,false],['Akun penampung kosong',f.suspense?`${money(f.suspense)} perlu diklasifikasikan.`:'Semua transaksi sudah memiliki akun final.',Boolean(f.suspense)],['Bukti dan cakupan lengkap','Rekening koran, saldo awal, serta dokumen pendukung sudah diperiksa.',false]].map(([title,desc,warn])=>`<div class="control ${warn?'warn':''}">${icon(warn?'warn':'check')}<div><h3>${title}</h3><p>${desc}</p>${warn?'<button class="link small" data-action="review">Periksa transaksi</button>':''}</div></div>`).join('')}${!closed?`<label class="signoff"><input type="checkbox" id="signoff" ${blocked?'disabled':''}><span>Saya sudah memeriksa laporan dan bukti untuk ${c.name}, ${PERIODS[state.period]}.</span></label><div class="action-foot"><button class="btn primary" id="close-button" data-action="confirm-close" disabled>Tutup buku ${PERIODS[state.period]}</button></div>`:`<div class="action-foot" style="padding-top:20px"><button class="btn" data-action="nav" data-view="reports">Lihat laporan</button></div>`}</section><div class="notice" style="margin-top:18px">Simulasi kesiapan penutupan. Aplikasi produksi memiliki pemeriksaan akuntansi lebih lengkap; prototipe ini tidak mengunci data sebenarnya.</div>`;}
function render(){if(!state.signedIn){renderLogin();return;}const views={home,work,documents,reports,ledger,close:closeView};root.innerHTML=`<div class="shell">${sidebar()}<div class="workspace">${topbar()}<main class="content" id="main">${views[state.view]()}</main></div></div>`;}
function showDialog(title,subtitle,body,back=null){if(!drawer.open)returnFocus=document.activeElement;dialogBack=back;drawer.innerHTML=`<header class="drawer-head"><div>${back?`<button class="link small" data-action="drawer-back">‹ Kembali ke ${back===review?'review transaksi':'jawaban'}</button>`:''}<h2 id="drawer-title">${title}</h2><p>${subtitle}</p></div><button class="btn ghost icon-only" data-action="dismiss" aria-label="Tutup panel">${icon('close')}</button></header><div class="drawer-body">${body}</div>`;if(!drawer.open)drawer.showModal();drawer.scrollTop=0;drawer.querySelector('[data-action="dismiss"]').focus();}
function restoreFocus(){if(returnFocus?.isConnected&&returnFocus.matches('button,input,select,a,[tabindex]'))returnFocus.focus();else (document.getElementById('question')||document.getElementById('page-title'))?.focus();}
function dismiss(){drawer.close();restoreFocus();}
function source(id,back=null){const [company,period,kind]=id.split(':'),c=companies.find(x=>x.id===company);if(!c||!PERIODS[period]||period==='2026-09')return;const d=docsFor(c,period).find(x=>x.id===id);if(!d)return;const f=sourceFigures(c,period),base=period==='2026-07'?c.july[2]:c.expense;let content='';if(kind==='bank'){content=`<h3>BCA — Rekening koran</h3><p class="subtitle">${c.name} · ${PERIODS[period]} · IDR</p><table><thead><tr><th>Uraian</th><th class="right">Masuk</th><th class="right">Keluar</th></tr></thead><tbody><tr><td>Saldo awal</td><td colspan="2" class="right num">${money(c.opening)}</td></tr><tr><td>05 · Pelanggan</td><td class="num right">${money(f.revenue)}</td><td class="right">–</td></tr><tr><td>12 · Pembelian / biaya jasa</td><td class="right">–</td><td class="num right">${money(f.cost)}</td></tr><tr><td>20 · Sewa dan operasional</td><td class="right">–</td><td class="num right">${money(base)}</td></tr>${company==='nusa'&&period==='2026-08'?`<tr class="highlight"><td>28 · PERLENGKAPAN KANTOR</td><td class="right">–</td><td class="num right">${money(2400000n)}</td></tr>`:''}<tr class="report-total"><td>Saldo akhir</td><td colspan="2" class="right num">${money(f.cash)}</td></tr></tbody></table>`;}else if(kind==='report'){content=`<h3>Laporan laba rugi — unggahan</h3><p class="subtitle">${c.name} · ${PERIODS[period]} · Laba Rugi!B8</p><table><tbody>${[['Pendapatan',f.revenue],['Harga pokok',-f.cost],['Beban usaha',-f.expense],['Laba bersih',f.profit]].map(([n,v],i)=>`<tr class="${i===3?'highlight':''}"><td>${n}</td><td class="num right">${money(v)}</td></tr>`).join('')}</tbody></table><p>Angka di atas berasal dari file unggahan. Dokumen ini tidak membuat jurnal.</p>`;}else if(kind==='ledger'){content=`<h3>Ekspor buku besar — saldo awal</h3><p class="subtitle">${c.name} · Saldo Awal!A2:D3 · IDR</p><table><thead><tr><th>Akun sumber</th><th class="right">Debit</th><th class="right">Kredit</th></tr></thead><tbody><tr class="highlight"><td>1001 · Bank</td><td class="num right">${money(c.opening)}</td><td class="right">–</td></tr><tr class="highlight"><td>3001 · Modal</td><td class="right">–</td><td class="num right">${money(c.opening)}</td></tr></tbody></table><p>Akun sumber dipetakan ke 1100 dan 3100. Impor yang disetujui menghasilkan jurnal OPEN-01.</p>`;}else if(kind==='profile'){content=`<h3>Profil perusahaan</h3><p class="subtitle">${c.name} · halaman 1</p><p style="background:#fff4cf;padding:12px">Kegiatan usaha: <strong>${c.industry}</strong>. ${c.id==='nusa'?'Perusahaan memasok kebutuhan pangan kepada toko dan restoran.':c.id==='loka'?'Perusahaan mendistribusikan barang dari pemasok ke pelanggan bisnis.':'Perusahaan menyediakan jasa desain untuk pelanggan bisnis.'}</p><p>Kelompok klien: ${c.group==='nusa-group'?'Grup Nusa':'Klien Aruna'}. Mata uang pembukuan: Rupiah.</p><p>Informasi ini memberi konteks bisnis; bukan nilai akun atau bukti saldo.</p>`;}else{content=`<h3>Perjanjian sewa dan layanan</h3><p class="subtitle">${c.name} · halaman 2</p><p style="background:#fff4cf;padding:12px"><strong>Pasal 3 — Biaya bulanan</strong><br>Biaya sewa dan layanan operasional bulanan sebesar ${money(base)} dibayar melalui transfer bank.</p><p>Dokumen mendukung pemeriksaan transaksi biaya tanggal 20. Mengunggah kontrak ini tidak otomatis mencatat biaya kedua kali.</p>`;}showDialog('Bukti sumber',d.name,`${badge(d.basis)}<div class="source-hint" style="margin-top:14px">${d.where} · ${PERIODS[period]} · Versi contoh 1</div><article class="paper">${content}</article><div class="notice">Dokumen sintetis untuk review desain. Kutipan merujuk versi sumber ini, terpisah dari perubahan pada Buku Besar.</div>`,back);}
function review(){if(!hasPending()){notify('Tidak ada transaksi yang perlu review pada cakupan ini.');return;}showDialog('Periksa transaksi','PT Nusa Niaga · BCA · 28 Agustus 2026',`${badge('Perlu review','review')}<div class="review-amount num">${money(2400000n)}</div><p class="muted">Pengeluaran · PERLENGKAPAN KANTOR</p><div class="divider"></div><button class="cite" data-action="review-source">${icon('doc')} Rekening koran · halaman 1, baris 4</button><form id="review-form"><div class="field"><label for="account">Akun tujuan</label><select id="account"><option value="6100">6100 — Beban operasional</option><option value="6200">6200 — Beban pemasaran</option></select></div><div class="row">${badge('Usulan AI','ai')}<span class="small muted">Keyakinan contoh 92%</span></div><p class="method">Uraian menyebut perlengkapan kantor. Cocokkan dengan bukti sebelum menyetujui.</p><div class="notice" style="margin:19px 0">Saat disetujui: debit akun beban ${money(2400000n)}, kredit 1999 Akun penampung ${money(2400000n)}. Saldo bank tetap. Jurnal asli tidak diubah.</div><button class="btn primary" type="submit">Setujui klasifikasi</button></form>`);}
function answerMarkup(a){return `<article class="answer"><div class="answer-question">${esc(a.question)}</div><div class="answer-content"><div class="answer-context">${esc(a.scopeLabel)} · ${PERIODS[a.period]}<br>${a.basis} · Jawaban saat pertanyaan diajukan</div>${a.html}<div class="citations">${a.sources.map(d=>`<button class="cite" data-action="answer-source" data-doc="${d.id}">${icon('doc')} ${esc(d.name)}<br>${d.where}</button>`).join('')}${a.action?`<button class="btn" data-action="answer-go" data-view="${a.action.view}" data-company="${a.action.company}" data-period="${a.period}">${a.action.label} ${icon('arrow')}</button>`:''}</div><p class="small muted" style="margin-top:13px">${a.limitation}</p></div></article>`;}
function historyPanel(){showDialog('Jawaban Buku',`${state.answers.length} pertanyaan · konteks tersimpan pada setiap jawaban`,state.answers.length?state.answers.slice().reverse().map(answerMarkup).join(''):`<div class="empty"><h3>Belum ada pertanyaan</h3><p>Tanyakan kesiapan tutup buku, laba, atau kegiatan usaha dari Beranda.</p></div>`);}
function makeAnswer(question,scope,period){const cs=selected(scope),a={question,scopeLabel:scopeName(scope),period,basis:'Dari Buku Besar',html:'',sources:[],action:null,limitation:'Simulasi dengan data sintetis. Angka tidak diperbarui pada jawaban lama.'},q=question.toLowerCase();if(period==='2026-09'){a.basis='Cakupan belum tersedia';a.html='<h3>Belum cukup data untuk menjawab.</h3><p>Dokumen dan jurnal September belum tersedia. Pilih Juli atau Agustus; Buku tidak menganggap nilai yang belum tersedia sebagai nol.</p>';return a;}if(/profil|usaha|bisnis|perusahaan bergerak/.test(q)){a.basis='Dari profil perusahaan';a.html='<h3>Kegiatan usaha dalam cakupan ini</h3><ul>'+cs.map(c=>`<li><strong>${c.name}</strong>: ${c.industry}.</li>`).join('')+'</ul>';a.sources=cs.map(c=>docsFor(c,period).find(d=>d.type==='Profil perusahaan'));a.limitation='Berdasarkan profil contoh yang telah dikonfirmasi; bukan kesimpulan dari saldo keuangan.';}else if(/banding|laba|laporan/.test(q)){a.basis='Angka dokumen dibandingkan dengan Buku Besar';a.html='<h3>Perbandingan laba bersih</h3>'+cs.map(c=>{const f=figures(c,period),reported=sourceFigures(c,period).profit,delta=f.profit-reported;return `<p><strong>${c.name}</strong><br>Dokumen: <span class="num">${money(reported)}</span><br>Buku: <span class="num">${money(f.profit)}</span><br>${delta?`Selisih ${money(delta)}: pengeluaran perlengkapan masih di akun penampung.`:'Tidak ada selisih dalam contoh ini.'}</p>`;}).join('');a.sources=cs.map(c=>docsFor(c,period).find(d=>d.type==='Laporan keuangan'));a.action={view:'reports',company:cs[0].id,label:'Telusuri laporan Buku'};}else if(/kas|saldo|bank/.test(q)){a.html='<h3>Saldo kas dan bank</h3><ul>'+cs.map(c=>`<li>${c.name}: <span class="num">${money(figures(c,period).cash)}</span>.</li>`).join('')+'</ul>';a.sources=cs.map(c=>docsFor(c,period).find(d=>d.type==='Rekening koran'));a.action={view:'ledger',company:cs[0].id,label:'Buka Buku Besar'};}else if(/tutup|siap|hambat|kurang|review/.test(q)){const open=cs.filter(c=>!isClosed(c,period));a.basis='Dari kontrol tutup buku';if(!open.length){a.html='<h3>Semua perusahaan dalam cakupan ini sudah ditutup.</h3><p>Laporan dan bukti tetap dapat ditelusuri.</p>';}else{a.html=`<h3>${open.length} perusahaan belum tutup buku.</h3><p><strong>PT Nusa Niaga</strong>: ${state.reviewed?'kontrol lolos; menunggu konfirmasi penutupan.':`satu pengeluaran ${money(2400000n)} masih di akun penampung.`}</p>`;a.action={view:state.reviewed?'close':'work',company:'nusa',label:state.reviewed?'Periksa tutup buku':'Selesaikan review'};}a.sources=cs.filter(c=>c.id==='nusa').map(c=>docsFor(c,period).find(d=>d.type==='Rekening koran'));}else{a.basis='Pertanyaan di luar contoh';a.html='<h3>Pertanyaan ini belum tersedia dalam prototipe.</h3><p>Coba tanyakan kesiapan tutup buku, bandingkan laba laporan dengan buku, saldo kas, atau kegiatan usaha perusahaan.</p>';a.limitation='Tidak ada jawaban atau angka yang dibuat untuk pertanyaan yang belum didukung.';}return a;}
async function ask(question){if(state.askBusy||!question.trim())return;const scope=state.scope,period=state.period;state.askBusy=true;const button=document.querySelector('#ask-form button');if(button){button.disabled=true;button.textContent='Menyiapkan…';}await new Promise(resolve=>setTimeout(resolve,250));if(!state.signedIn){state.askBusy=false;return;}state.answers.push(makeAnswer(question.trim(),scope,period));state.askBusy=false;render();historyPanel();}
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='login-form'){const f=new FormData(e.target);if(state.loginStep==='email'){const email=String(f.get('email')).trim().toLowerCase();if(email!=='akuntan@buku.example'){state.loginError='Email belum ada dalam undangan contoh. Gunakan akuntan@buku.example.';renderLogin();return;}state.email=email;state.loginStep='code';state.loginError='';renderLogin();document.getElementById('code').focus();}else if(f.get('code')==='123456'){state.signedIn=true;state.loginError='';syncURL();render();document.getElementById('page-title').focus();}else{state.loginError='Kode tidak cocok. Gunakan kode contoh 123456.';renderLogin();document.getElementById('code').focus();}}else if(e.target.id==='ask-form'){void ask(document.getElementById('question').value);}else if(e.target.id==='review-form'){if(!hasPending())return;state.account=document.getElementById('account').value;state.reviewed=true;dismiss();navigate('ledger','nusa');notify('Klasifikasi disetujui. Jurnal RECLASS-01 tercatat; saldo bank tetap.');}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='scope'||t.id==='period'){state[t.id]=t.value;state.filter='Semua';state.search='';syncURL();render();document.getElementById(t.id).focus();}else if(t.id==='doc-filter'){state.filter=t.value;render();document.getElementById('doc-filter').focus();}else if(t.id==='signoff'){document.getElementById('close-button').disabled=!t.checked;}});
document.addEventListener('input',e=>{if(e.target.id==='doc-search'){const start=e.target.selectionStart;state.search=e.target.value;render();const input=document.getElementById('doc-search');input.focus();input.setSelectionRange(start,start);}});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;const a=b.dataset.action;if(a==='nav')navigate(b.dataset.view);else if(a==='ask')void ask(b.dataset.question);else if(a==='history')historyPanel();else if(a==='dismiss')dismiss();else if(a==='drawer-back')dialogBack?.();else if(a==='source')source(b.dataset.doc);else if(a==='answer-source')source(b.dataset.doc,historyPanel);else if(a==='review-source')source('nusa:2026-08:bank',review);else if(a==='review')review();else if(a==='report-company')navigate('reports',b.dataset.company);else if(a==='ledger-company')navigate('ledger',b.dataset.company);else if(a==='close-view')navigate('close',b.dataset.company);else if(a==='answer-go'){dismiss();state.period=b.dataset.period;navigate(b.dataset.view,b.dataset.company);}else if(a==='confirm-close'){if(state.scope!=='nusa'||state.period!=='2026-08'||!state.reviewed||!document.getElementById('signoff')?.checked)return;state.closed=true;render();document.getElementById('page-title')?.focus();notify('Buku Agustus 2026 ditutup untuk PT Nusa Niaga.');}else if(a==='logout'){state.signedIn=false;state.loginStep='email';render();}else if(a==='login-back'){state.loginStep='email';state.loginError='';renderLogin();}else if(a==='reset'){if(drawer.open)dismiss();Object.assign(state,{signedIn:false,email:'',loginStep:'email',loginError:'',scope:'all',period:'2026-08',view:'home',reviewed:false,account:'6100',closed:false,filter:'Semua',search:'',answers:[],askBusy:false});syncURL();render();notify('Prototipe kembali ke keadaan awal.');}});
drawer.addEventListener('cancel',()=>{setTimeout(restoreFocus,0);});
drawer.addEventListener('keydown',event=>{
  if(event.key!=='Tab')return;
  const controls=[...drawer.querySelectorAll('button:not(:disabled),input:not(:disabled),select:not(:disabled),a[href],[tabindex="0"]')].filter(el=>el.getClientRects().length);
  const first=controls[0],last=controls[controls.length-1];
  if(event.shiftKey&&document.activeElement===first){event.preventDefault();last?.focus();}
  else if(!event.shiftKey&&document.activeElement===last){event.preventDefault();first?.focus();}
});
render();
</script>
</body>
</html>
