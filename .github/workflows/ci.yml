name: CI
on:
  pull_request:
  push:
    branches: [staging, main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buku
          POSTGRES_PASSWORD: buku
          POSTGRES_DB: buku
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U buku" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://buku:buku@localhost:5432/buku
      TEST_DATABASE_URL: postgresql://buku:buku@localhost:5432/buku_test
      DEMO_MODE: "true"
      EVIDENCE_ENABLED: "true"
      BETTER_AUTH_URL: http://localhost:3200
      BETTER_AUTH_SECRET: synthetic-ci-only-secret-not-for-any-deployment
      AI_API_KEY: ""
      AI_MODEL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: psql postgresql://buku:buku@localhost:5432/buku -c "CREATE DATABASE buku_test"
      - run: npx prisma migrate deploy
      - name: Lint & typecheck
        run: npm run lint && npm run typecheck
      - name: Unit + DB + ground-truth tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Seed + verify books (layer 2)
        run: npm run demo:reset && npm run verify:books
      - name: Playwright investor walk (layer 3)
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Private-mode workspace parity (synthetic data)
        run: npm run test:e2e
        env:
          EVIDENCE_ENABLED: "true"
          DEMO_MODE: "false"
          AI_API_KEY: ""
          AI_MODEL: ""
      - name: Invitation-only shared-code access (synthetic data)
        run: npm run test:e2e
        env:
          DEMO_MODE: "false"
          AUTH_MODE: shared-code
          AUTH_SHARED_CODE: "482619735084"
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results, retention-days: 7 }
