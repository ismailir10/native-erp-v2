name: CI
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

# A new push to a PR cancels the run it supersedes. Pushes to main always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Lint, typecheck, unit tests and production build. Runs on every ready PR and on every push
  # to main. Draft PRs skip CI until they are marked ready for review. Playwright lives in e2e.yml.
  check:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buku
          POSTGRES_PASSWORD: buku
          POSTGRES_DB: buku
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U buku" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://buku:buku@localhost:5432/buku
      TEST_DATABASE_URL: postgresql://buku:buku@localhost:5432/buku_test
      DEMO_MODE: "true"
      EVIDENCE_ENABLED: "true"
      APP_URL: http://localhost:3200
      AI_API_KEY: ""
      AI_MODEL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: psql postgresql://buku:buku@localhost:5432/buku -c "CREATE DATABASE buku_test"
      - run: npx prisma migrate deploy
      - name: Lint & typecheck
        run: npm run lint && npm run typecheck
      - name: Unit + DB + ground-truth tests
        run: npm test
      # Without NEXT_PUBLIC_SUPABASE_* the auth client is simply unconfigured (lib/supabase/env.ts),
      # which is enough to catch compile, route and server/client boundary errors.
      - name: Build
        run: npm run build
