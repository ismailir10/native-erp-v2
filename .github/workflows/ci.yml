name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: buku
          POSTGRES_PASSWORD: buku
          POSTGRES_DB: buku
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U buku" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://buku:buku@localhost:5432/buku
      TEST_DATABASE_URL: postgresql://buku:buku@localhost:5432/buku_test
      DEMO_MODE: "true"
      EVIDENCE_ENABLED: "true"
      APP_URL: http://localhost:3200
      AI_API_KEY: ""
      AI_MODEL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: psql postgresql://buku:buku@localhost:5432/buku -c "CREATE DATABASE buku_test"
      - run: npx prisma migrate deploy
      - name: Lint & typecheck
        run: npm run lint && npm run typecheck
      - name: Unit + DB + ground-truth tests
        run: npm test
      # Auth for the e2e walk: a throwaway local Supabase stack (Auth + gateway + its own Postgres on :54322).
      # NEXT_PUBLIC_* are inlined at build time, so the stack must be up before `next build`.
      - uses: supabase/setup-cli@v1
        with: { version: 2.118.0 } # pinned: resolving "latest" calls the GitHub API, which rate-limits CI
      - name: Supabase Auth (local stack)
        run: |
          supabase start -x realtime,storage-api,imgproxy,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          supabase status -o env > "$RUNNER_TEMP/supabase.env"
          . "$RUNNER_TEMP/supabase.env"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=${SECRET_KEY:-$SERVICE_ROLE_KEY}" >> "$GITHUB_ENV"
      - name: Build
        run: npm run build
      - name: Seed + verify books (layer 2)
        run: npm run demo:reset && npm run verify:books
      - name: Playwright investor walk (layer 3)
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - name: Private-mode workspace parity (synthetic data)
        run: npm run test:e2e
        env:
          EVIDENCE_ENABLED: "true"
          DEMO_MODE: "false"
          AI_API_KEY: ""
          AI_MODEL: ""
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results, retention-days: 7 }
